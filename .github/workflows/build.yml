# Release build of PalaTerm.exe from the tagged source.
# The exe is reproducible: the same source and Go version give the same bytes,
# so the SHA-256 printed here can be compared with the one in the release notes.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Keep the files exactly as stored in the repository (the UI files are embedded in the exe)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache: false
      - name: Vet and test
        shell: bash
        run: |
          go vet ./...
          go test ./...
      - name: Known vulnerabilities (Go module dependencies)
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -tags production -ldflags="-H windowsgui -s -w" -o build/bin/PalaTerm.exe .
          sha256sum build/bin/PalaTerm.exe | tee build/bin/PalaTerm.exe.sha256
          echo "SHA-256 of PalaTerm.exe: \`$(cut -d' ' -f1 build/bin/PalaTerm.exe.sha256)\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PalaTerm-${{ github.ref_name }}
          path: |
            build/bin/PalaTerm.exe
            build/bin/PalaTerm.exe.sha256
